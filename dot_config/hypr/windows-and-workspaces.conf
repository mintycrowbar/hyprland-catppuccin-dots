# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules


# Ignore maximize requests from apps
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# hypremoji window rules
windowrule {
  name = windowrule-2
  float = on
  size = 640 340
  move = (603) (404)
  match:title = ^(HyprEmoji)$
}




#### Hyprland window rules for JetBrains IDEs running on Wayland (huge thanks to `https://github.com/Lumanyx/jetbrains-hyprland-fixes`) ###

# Prevent tooltips from taking focus (always have a title of `win.<id>`)
windowrule {
  name = windowrule-3
  no_initial_focus = on
  match:class = ^(.*jetbrains.*)$
  match:title = ^(win.*)$
}


# Make "Go to file" and other dialogs always focused when open
windowrule {
  name = windowrule-4
  stay_focused = on
  match:class = ^(.*jetbrains.*)$
  match:title = ^$
  match:float = 1
}


# fix tab dragging (always have a single space character as their title)
windowrule {
  name = windowrule-5
  no_initial_focus = on
  match:class = ^(.*jetbrains.*)$
  match:title = ^\\s$
}


# Tile new tabs automatically
windowrule {
  name = windowrule-6
  tile = on
  match:class = ^(jetbrains-*)
  match:float = 0
}


########################################



# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-7
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# automatically start Waypaper as floating
windowrule {
  name = windowrule-8
  float = on
  center = true 
  size = 900 800
  match:class = ^(waypaper)$
}


# automatically start the CopyQ menu as floating
windowrule {
  name = windowrule-9
  float = on
  match:class = ^(com\.github\.hluk\.copyq)$
}


